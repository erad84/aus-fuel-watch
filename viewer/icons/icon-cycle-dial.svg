<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aus Fuel Watch cycle dial">
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Peak (top): continuous arc through 12 o'clock -->
    <path stroke="#ef4444" stroke-width="11"
      d="M 30.06 30.06 A 48 48 0 0 1 97.94 30.06" />
    <!-- Falling (right) -->
    <path stroke="#3b82f6" stroke-width="11"
      d="M 97.94 30.06 A 48 48 0 0 1 97.94 97.94" />
    <!-- Bottom -->
    <path stroke="#22c55e" stroke-width="11"
      d="M 97.94 97.94 A 48 48 0 0 1 30.06 97.94" />
    <!-- Rising (left) -->
    <path stroke="#eab308" stroke-width="11"
      d="M 30.06 97.94 A 48 48 0 0 1 30.06 30.06" />
    <!-- Hub -->
    <circle cx="64" cy="64" r="10.8" stroke="#94a3b8" stroke-width="2.2" />
  </g>
  <!-- Pip on Falling (3 o'clock) -->
  <circle cx="112" cy="64" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
</svg>
