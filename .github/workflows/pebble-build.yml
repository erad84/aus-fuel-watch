# Thin caller: build Aus Fuel Watch on PR + push to main.
# Reusable: erad84/pebble-ci @v1 (https://github.com/erad84/pebble-ci)

name: pebble-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: erad84/pebble-ci/.github/workflows/pebble-build-reusable.yml@v1
    with:
      working-directory: '.'
      artifact-name: aus-fuel-watch
      # package.json has no npm deps; auto skips install (same as local pebble build)
      npm-install: auto
