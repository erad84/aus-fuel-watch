name: heartbeat

# GitHub disables scheduled workflows in a repository with no activity for 60
# days. This project's only activity is the collector's own commits, which do
# not count once the app is finished and main stops changing. A trivial monthly
# commit keeps the collector alive.

on:
  schedule:
    - cron: '13 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch the keepalive marker
        run: |
          mkdir -p .github
          date -u +'last heartbeat: %Y-%m-%dT%H:%M:%SZ' > .github/heartbeat
          git config user.name  'aus-fuel-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/heartbeat
          git diff --quiet --cached && echo 'no change' && exit 0
          git commit -m 'chore: heartbeat to keep scheduled workflows enabled'
          git push
