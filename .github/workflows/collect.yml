name: collect

# Refreshes today's fuel prices up to six times (AEST / UTC+10). Past days stay
# immutable; each successful run overwrites today's aggregate slots and freshens
# station prices where the census has newer values.

on:
  schedule:
    # 05:00 AEST → 19:00 UTC (previous calendar day in UTC)
    - cron: '0 19 * * *'
    # 08:00 AEST
    - cron: '0 22 * * *'
    # 11:00 AEST
    - cron: '0 1 * * *'
    # 14:00 AEST
    - cron: '0 4 * * *'
    # 17:00 AEST
    - cron: '0 7 * * *'
    # 20:00 AEST
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      # Published JSON lives on the `data` branch (served by GitHub Pages). It is
      # checked out into ./docs as a nested clone so commits push only history
      # files without touching main.
      - name: Check out data branch
        continue-on-error: true
        id: checkout_data
        uses: actions/checkout@v4
        with:
          ref: data
          path: docs

      - name: Bootstrap data branch workspace
        if: steps.checkout_data.outcome != 'success'
        run: |
          mkdir -p docs/v1
          cd docs
          git init -b data
          git config user.name 'aus-fuel-watch-bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        env:
          FUELCHECK_API_KEY: ${{ secrets.FUELCHECK_API_KEY }}
          FUELCHECK_API_SECRET: ${{ secrets.FUELCHECK_API_SECRET }}
          SA_FUEL_TOKEN: ${{ secrets.SA_FUEL_TOKEN }}
          QLD_FUEL_TOKEN: ${{ secrets.QLD_FUEL_TOKEN }}
          VIC_FUEL_API_KEY: ${{ secrets.VIC_FUEL_API_KEY }}
        run: node data/collect.js

      - name: Commit and push data branch
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'aus-fuel-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git remote get-url origin 2>/dev/null; then
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo 'no change'
            exit 0
          fi
          git add -A
          git commit -m "data: $(date -u +%Y-%m-%d) collection"
          for attempt in 1 2 3; do
            if git push -u origin HEAD:data; then exit 0; fi
            git pull --rebase origin data || exit 1
          done
          exit 1
