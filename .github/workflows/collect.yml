name: collect

# Accumulates fuel price history from official government feeds. A missed day
# cannot be backfilled, so there are three scheduled attempts per day and writes
# only ever fill an empty slot.

on:
  schedule:
    # 23:07 UTC → ~07:07–10:07 local in every state (inside the sampling window).
    - cron: '7 23 * * *'
    # Mid-morning retry, still inside the window for eastern states.
    - cron: '37 2 * * *'
    # Catch-up: fill any still-empty slot regardless of local hour.
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      catchup:
        description: 'Fill empty slots regardless of local hour'
        type: boolean
        default: true

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      # Published JSON lives on the `data` branch (served by GitHub Pages). It is
      # checked out into ./docs as a nested clone so commits push only history
      # files without touching main.
      - name: Check out data branch
        continue-on-error: true
        id: checkout_data
        uses: actions/checkout@v4
        with:
          ref: data
          path: docs

      - name: Bootstrap data branch workspace
        if: steps.checkout_data.outcome != 'success'
        run: |
          mkdir -p docs/v1
          cd docs
          git init -b data
          git config user.name 'aus-fuel-watch-bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        env:
          FUELCHECK_API_KEY: ${{ secrets.FUELCHECK_API_KEY }}
          FUELCHECK_API_SECRET: ${{ secrets.FUELCHECK_API_SECRET }}
          SA_FUEL_TOKEN: ${{ secrets.SA_FUEL_TOKEN }}
          QLD_FUEL_TOKEN: ${{ secrets.QLD_FUEL_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 6 * * *" ] || [ "${{ inputs.catchup }}" = "true" ]; then
            node data/collect.js --catchup
          else
            node data/collect.js
          fi

      - name: Commit and push data branch
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'aus-fuel-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git remote get-url origin 2>/dev/null; then
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo 'no change'
            exit 0
          fi
          git add -A
          git commit -m "data: $(date -u +%Y-%m-%d) collection"
          for attempt in 1 2 3; do
            if git push -u origin HEAD:data; then exit 0; fi
            git pull --rebase origin data || exit 1
          done
          exit 1
